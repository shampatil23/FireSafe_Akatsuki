<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgniVeer - Login / Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <style>
        :root {
            --primary: #f97316;
            --primary-glow: rgba(249, 115, 22, 0.4);
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(249, 115, 22, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.15) 0%, transparent 50%);
        }

        /* Animated background particles */
        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            animation: float 15s infinite linear;
            opacity: 0;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(-50px) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-10vh) translateX(50px) scale(1); opacity: 0; }
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-header i {
            font-size: 3rem;
            color: var(--primary);
            filter: drop-shadow(0 0 10px var(--primary-glow));
            margin-bottom: 15px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--primary-glow)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px var(--primary)); }
        }

        .brand-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 30px;
            position: relative;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .toggle-btn.active {
            color: #fff;
        }

        .toggle-slider {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 1;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 14px 14px 14px 42px;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(0, 0, 0, 0.3);
        }

        .form-group i {
            position: absolute;
            left: 14px;
            top: 38px;
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .form-group input:focus + i, .form-group input:not(:placeholder-shown) + i {
            color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #f97316, #ef4444);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .form-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loader */
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div id="fireflies"></div>

    <div class="auth-container">
        <div class="brand-header">
            <i class="fas fa-fire-flame-curved"></i>
            <h1>AgniVeer</h1>
            <p>Intelligence Platform Access</p>
        </div>

        <div class="form-section active" id="login-section" style="text-align: center; padding: 10px 0;">
            <p style="color: var(--text-muted); margin-bottom: 25px;">Select your designated role to enter the platform.</p>
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <button onclick="oneClickLogin('admin')" class="submit-btn" id="btn-admin" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
                    <span><i class="fas fa-chart-line"></i> Enter Admin Dashboard</span>
                    <div class="loader" id="loader-admin"></div>
                </button>
                
                <button onclick="oneClickLogin('operator')" class="submit-btn" id="btn-operator" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                    <span><i class="fas fa-headset"></i> Enter Operator Desk</span>
                    <div class="loader" id="loader-operator"></div>
                </button>
            </div>
        </div>

    </div>

    <script>
        // Generate background fireflies
        const firefliesContainer = document.getElementById('fireflies');
        for(let i=0; i<30; i++) {
            let firefly = document.createElement('div');
            firefly.className = 'firefly';
            firefly.style.left = Math.random() * 100 + 'vw';
            firefly.style.animationDelay = Math.random() * 15 + 's';
            firefly.style.animationDuration = 10 + Math.random() * 10 + 's';
            firefliesContainer.appendChild(firefly);
        }

        function oneClickLogin(role) {
            const btnText = document.querySelector(`#btn-${role} span`);
            const loader = document.getElementById(`loader-${role}`);
            
            // UI Loading state
            btnText.style.display = 'none';
            loader.style.display = 'block';

            // Simulate slight delay for effect
            setTimeout(() => {
                localStorage.setItem('agniVeerToken', 'demo-token-12345');
                if (role === 'admin') {
                    localStorage.setItem('agniVeerRole', 'admin');
                    localStorage.setItem('agniVeerUser', JSON.stringify({ name: 'System Admin', email: 'admin@agniveer.local' }));
                    window.location.href = 'index.html';
                } else {
                    localStorage.setItem('agniVeerRole', 'operator');
                    localStorage.setItem('agniVeerUser', JSON.stringify({ name: 'Dispatcher 01', email: 'operator@agniveer.local' }));
                    window.location.href = 'operator.html';
                }
            }, 800);
        }
    </script>
</body>
</html>
